<!-- BEGIN: content -->
{FILE "bo/node/shared_header.html"}
<fieldset>
  {FILE "bo/node/item_image_list.html"}
</fieldset>
<fieldset>
    <div class="row">
        <label>Title</label>    
        <input type="text" name="node[title]" value="{NODE.title|htmlspecialchars}" />
      </div>
    <div class="row">
        <input type="checkbox" name="node[component][show_caption]" value="1" id="node-component-show-caption" {CHECKED_node_component_show_caption} /> <label for="node-component-show-caption">Show caption</label>
    </div>
    
    <div class="row">
        <label for="node-strapline">Strapline:</label>
        <input type="text" name="node[strapline]" id="node-strapline" value="{NODE.strapline|htmlspecialchars}" />
    </div>

    <div class="row description">
        <label for="node-description">Description:</label>
        <textarea name="node[description]" id="node-description" class="small" style="width: 100%;" title="Please try to fit your description into this input box, this will display Google in the search result" cols="50" rows="20">{NODE.description|htmlspecialchars}</textarea>
    </div>
    <div class="advanced">
        {FILE "bo/node/item_content.html"}
    </div>
</fieldset>
{FILE "bo/node/shared_footer.html"}
<!-- END: content -->
