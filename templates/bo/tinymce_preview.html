    if (hugerte.get('{TINYMCE.edit_element}')) {
        hugerte.get('{TINYMCE.edit_element}').destroy();
    }

    setTimeout(() => {
        hugerte.init({
            selector:'#{TINYMCE.edit_element}',
            content_css: "/css/style.css?{ONYX_CACHE_VERSION}",

            readonly: true,

            toolbar: false,
            statusbar: false,
            plugins: 'autoresize',
        });
    }, 100);
